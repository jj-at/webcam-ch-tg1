<!DOCTYPE html>
<html lang="es">
<head>
    <title>Webcam Clima Tecpán Guatemala, Chimaltenango - En Vivo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background: #f0f8ff; 
        }

        /* Estilo para la Webcam */
        #webcam-img { 
            max-width: 100%; 
            height: auto; 
            border: 3px solid #333; 
            border-radius: 8px; 
            margin: 20px 0 5px 0; 
        }

        /* Contenedor del Mapa */
        #mapa-container {
            max-width: 900px;
            margin: 30px auto;
            text-align: left;
        }

        #mapa-satelital { 
            width: 100%; 
            height: 520px; 
            border: 3px solid #333;
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
        }

        /* Etiquetas de Departamentos */
        .nombre-departamento {
            background: transparent;
            border: none;
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            text-shadow:
                1px 1px 2px black,
                -1px -1px 2px black,
                1px -1px 2px black,
                -1px 1px 2px black;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- 1. WEBCAM EN VIVO -->
    <h1>📷 Webcam en Vivo</h1>
    <img src="" id="webcam-img" alt="Webcam en vivo"> 
    <p><em>La imagen se actualiza aproximadamente cada minuto...</em></p>

    <hr style="margin: 40px 0;">

    <!-- 2. MAPA INTERACTIVO (SATÉLITE Y RADAR) -->
    <div id="mapa-container">
        <h2>🛰 Monitoreo Meteorológico — Guatemala</h2>
        <div id="mapa-satelital"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ==========================================================
        // A. WEBCAM EN VIVO
        // ==========================================================
        const URL_BASE_IMAGEN = "https://lh3.googleusercontent.com/d/1MzSP5TCtzalEJcWWsg0PAHfV_61lf9Hd";

        function actualizarWebcam() {
            const ahora = new Date();
            const img = document.getElementById('webcam-img');
            img.src = `${URL_BASE_IMAGEN}?t=${ahora.getTime()}`;
        }


        // ==========================================================
        // B. MAPA BASE LEAFLET
        // ==========================================================
        var map = L.map('mapa-satelital').setView([15.5, -90.2], 7);

        // Capas Base
        var esriTopo = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
            { maxZoom: 12, minZoom: 3, attribution: 'Tiles © Esri' }
        ).addTo(map);

        var cartoVoyager = L.tileLayer(
            'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
            { maxZoom: 12, minZoom: 4, attribution: '© OpenStreetMap | CartoDB' }
        );


        // ==========================================================
        // C. CAPA 1: SATÉLITE GOES GEOCOLOR (NOAA)
        // ==========================================================
        var imageServer = 'https://satellitemaps.nesdis.noaa.gov/arcgis/rest/services/MERGED_GeoColor/ImageServer/exportImage';
        var xmin = -97, ymin = 8, xmax = -84, ymax = 21;
        var width = 2000, height = 1400;

        function getSatelliteURL() {
            return imageServer +
                '?bbox=' + xmin + ',' + ymin + ',' + xmax + ',' + ymax +
                '&bboxSR=4326' +
                '&imageSR=4326' +
                '&size=' + width + ',' + height +
                '&format=jpgpng' +
                '&transparent=false' +
                '&f=image' +
                '&_t=' + Date.now();
        }

        var satelliteLayer = L.imageOverlay(
            getSatelliteURL(),
            [[ymin, xmin], [ymax, xmax]],
            { opacity: 0.75, interactive: false, attribution: 'NOAA / NESDIS — GOES GeoColor' }
        ).addTo(map);

        function actualizarSatelite() {
            satelliteLayer.setUrl(getSatelliteURL());
        }

        // ==========================================================
        // D. CAPA 2: RADAR EN VIVO (RAINVIEWER)
        // ==========================================================
        // 1. Crear la capa y AÑADIRLA al mapa de Leaflet
        var radarLayer = L.layerGroup().addTo(map); 
        
        function cargarRadarRainViewer() {
            fetch('https://api.rainviewer.com/public/weather-maps.json')
                .then(response => response.json())
                .then(data => {
                    radarLayer.clearLayers(); // Limpiar capas anteriores al refrescar
        
                    var host = data.host; // p. ej. "https://tilecache.rainviewer.com"
                    var ultimasImagenes = data.radar.past; // Array de imágenes pasadas
                    var ultimaRuta = ultimasImagenes[ultimasImagenes.length - 1].path;
                    
                    // Construcción de la URL de teselas
                    // {host}{path}/{size}/{z}/{x}/{y}/{color}/{options}.png
                    var tileUrl = host + ultimaRuta + '/256/{z}/{x}/{y}/2/1_1.png'; //
        
                    var tile = L.tileLayer(tileUrl, {
                        tileSize: 256,
                        opacity: 0.7,
                        maxNativeZoom: 7, // Limite real que ofrece RainViewer
                        maxZoom: 19,       // Permite ver la capa estirada en zooms mayores
                        attribution: 'Datos meteorológicos © <a href="https://www.rainviewer.com/" target="_blank">RainViewer</a>'
                    });
        
                    radarLayer.addLayer(tile);
                })
                .catch(err => console.error('Error cargando RainViewer:', err));
        }
        
        // Llamar a la función
        cargarRadarRainViewer();

        // ==========================================================
        // E. CAPA 3: DEPARTAMENTOS Y ETIQUETAS (INAB)
        // ==========================================================
        var departamentosURL = 'https://sig.inab.gob.gt/server/rest/services/InformacionBase/Basemap_DinCob2016_2020/MapServer/0/query?where=1%3D1&outFields=*&returnGeometry=true&f=geojson';
        var departamentosLayer = L.layerGroup();

        fetch(departamentosURL)
            .then(res => res.json())
            .then(data => {
                var departamentos = L.geoJSON(data, {
                    style: { color: 'white', weight: 1.5, opacity: 0.9, fill: false },
                    onEachFeature: function(feature, layer) {
                        var nombre = feature.properties.NOMBRE || feature.properties.NOMBRE_DPT || feature.properties.DEPARTAMEN || feature.properties.DEPARTAMENTO || feature.properties.name || '';
                        if (nombre) {
                            var centro = layer.getBounds().getCenter();
                            L.marker(centro, {
                                icon: L.divIcon({
                                    className: 'nombre-departamento',
                                    html: nombre,
                                    iconSize: [120, 20],
                                    iconAnchor: [60, 10]
                                }),
                                interactive: false
                            }).addTo(departamentosLayer);
                        }
                    }
                });

                departamentos.addTo(departamentosLayer);
                departamentosLayer.addTo(map);

                departamentosLayer.eachLayer(function(layer) {
                    if (layer instanceof L.Marker) {
                        layer.setZIndexOffset(1000);
                    }
                });

                L.geoJSON(data, {
                    style: { color: 'white', weight: 3, opacity: 1, fill: false }
                }).addTo(map);
            })
            .catch(err => console.error('Error cargando departamentos:', err));


        // ==========================================================
        // F. CONTROL DE CAPAS (SELECTOR DE CHECKBOXES/BOTONES)
        // ==========================================================
        var baseMaps = {
            "Esri Topográfico": esriTopo,
            "CartoDB Voyager": cartoVoyager
        };

        var overlayMaps = {
            "🛰 Satélite GOES GeoColor": satelliteLayer,
            "🌧 Radar RainViewer": radarLayer,
            "📍 Departamentos": departamentosLayer
        };

        // Agregar el control al mapa (esquina superior derecha)
        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);


        // ==========================================================
        // G. CONTROL DE OPACIDAD PARA EL SATÉLITE
        // ==========================================================
        var opacityControl = L.control({ position: 'topright' });
        opacityControl.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'leaflet-bar');
            div.style.background = 'white';
            div.style.padding = '8px';
            div.style.marginTop = '10px';
            div.innerHTML = '<label style="font-size:12px;">Opacidad Satélite<br><input id="opacitySlider" type="range" min="0" max="1" step="0.05" value="0.75"></label>';
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        opacityControl.addTo(map);

        document.addEventListener('input', function(e) {
            if (e.target.id === 'opacitySlider') {
                satelliteLayer.setOpacity(parseFloat(e.target.value));
            }
        });


        // ==========================================================
        // H. INICIALIZACIÓN Y REFRESCADO
        // ==========================================================
        window.onload = function() {
            actualizarWebcam();
            
            // Refrescar Webcam cada 60 segundos
            setInterval(actualizarWebcam, 60000);
            
            // Refrescar Satélite GOES cada 5 minutos
            setInterval(actualizarSatelite, 300000);

            // Refrescar Radar RainViewer cada 10 minutos
            setInterval(cargarRadarRainViewer, 600000);
        };
    </script>
</body>
</html>
