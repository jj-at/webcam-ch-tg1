<!DOCTYPE html>
<html lang="es">
<head>
    <title>Webcam Clima Tecpán Guatemala, Chimaltenango - En Vivo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 15px 10px; 
            background: #f0f8ff; 
            margin: 0;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        /* Contenedores Principales */
        .mapa-seccion {
            max-width: 900px;
            margin: 20px auto;
            text-align: left;
        }

        /* Estilo para la Webcam */
        #webcam-img { 
            width: 100%; 
            max-height: 520px;
            object-fit: cover;
            border: 3px solid #333; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: block;
            margin: 10px 0;
        }

        #mapa-satelital { 
            width: 100%; 
            height: 520px; 
            border: 3px solid #333;
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
        }

        /* Contenedor e Iframe de Blitzortung */
        .blitzortung-iframe {
            width: 100%;
            height: 520px;
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background-color: #000;
        }

        /* Etiquetas de Departamentos */
        .nombre-departamento {
            background: transparent;
            border: none;
            color: white;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            text-shadow:
                1px 1px 2px black,
                -1px -1px 2px black,
                1px -1px 2px black,
                -1px 1px 2px black;
            white-space: nowrap;
        }

        /* Botón y Panel Desplegable de Opacidad */
        .contenedor-opacidad {
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 12px;
            overflow: hidden;
        }

        .btn-toggle-opacidad {
            background: #ffffff;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #333;
        }

        .btn-toggle-opacidad:hover {
            background: #f0f0f0;
        }

        .panel-sliders-opacidad {
            display: none; /* Oculto por defecto */
            padding: 10px;
            border-top: 1px solid #ddd;
            background: #fafafa;
        }

        .panel-sliders-opacidad.activo {
            display: block; /* Se muestra al presionar el botón */
        }

        .panel-sliders-opacidad label {
            display: block;
            margin-bottom: 8px;
        }

        .panel-sliders-opacidad label:last-child {
            margin-bottom: 0;
        }

        /* Ajustes específicos para móviles */
        @media (max-width: 600px) {
            body {
                padding: 10px 5px;
            }

            #webcam-img, #mapa-satelital, .blitzortung-iframe {
                height: 400px;
                max-height: 60vh;
            }

            h2 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- 1. WEBCAM EN VIVO -->
    <div class="mapa-seccion">
        <h2>📷 Webcam en Vivo</h2>
        <img src="" id="webcam-img" alt="Webcam en vivo"> 
        <p style="text-align: center; font-size: 0.9rem;"><em>La imagen se actualiza aproximadamente cada minuto...</em></p>
    </div>

    <hr style="margin: 30px 0;">

    <!-- 2. MAPA INTERACTIVO (SATÉLITE GOES + RADAR RAINVIEWER + DEPARTAMENTOS) -->
    <div class="mapa-seccion">
        <h2>🛰 Monitoreo Meteorológico — Guatemala (Satélite y Radar)</h2>
        <div id="mapa-satelital"></div>
    </div>

    <hr style="margin: 30px 0;">

    <!-- 3. MAPA DE RAYOS Y TORMENTAS EN TIEMPO REAL (BLITZORTUNG) -->
    <div class="mapa-seccion">
        <h2>⚡ Radar de Rayos y Tormentas en Tiempo Real (Blitzortung)</h2>
        <p style="font-size: 0.9rem;">Muestra actividad eléctrica en tiempo real con colores según la antigüedad del rayo.</p>
        
        <iframe 
            class="blitzortung-iframe"
            src="https://map.blitzortung.org/index.php?interactive=1&NavigationControl=1&FullScreenControl=1&Cookies=0&InfoDiv=0&MenuButtonDiv=1&ScaleControl=1&MapStyle=1#7/15.5/-90.2"
            title="Blitzortung Live Lightning Map"
            allowfullscreen>
        </iframe>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ==========================================================
        // A. WEBCAM EN VIVO
        // ==========================================================
        const URL_BASE_IMAGEN = "https://lh3.googleusercontent.com/d/1MzSP5TCtzalEJcWWsg0PAHfV_61lf9Hd";

        function actualizarWebcam() {
            const ahora = new Date();
            const img = document.getElementById('webcam-img');
            img.src = `${URL_BASE_IMAGEN}?t=${ahora.getTime()}`;
        }


        // ==========================================================
        // B. MAPA BASE LEAFLET
        // ==========================================================
        var map = L.map('mapa-satelital').setView([15.5, -90.2], 7);

        // Capas Base
        var esriTopo = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
            { maxZoom: 12, minZoom: 3, attribution: 'Tiles © Esri' }
        ).addTo(map);

        var cartoVoyager = L.tileLayer(
            'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
            { maxZoom: 12, minZoom: 4, attribution: '© OpenStreetMap | CartoDB' }
        );


        // ==========================================================
        // C. CAPA 1: SATÉLITE GOES GEOCOLOR (NOAA)
        // ==========================================================
        var imageServer = 'https://satellitemaps.nesdis.noaa.gov/arcgis/rest/services/MERGED_GeoColor/ImageServer/exportImage';
        var xmin = -97, ymin = 8, xmax = -84, ymax = 21;
        var width = 2000, height = 1400;

        function getSatelliteURL() {
            return imageServer +
                '?bbox=' + xmin + ',' + ymin + ',' + xmax + ',' + ymax +
                '&bboxSR=4326' +
                '&imageSR=4326' +
                '&size=' + width + ',' + height +
                '&format=jpgpng' +
                '&transparent=false' +
                '&f=image' +
                '&_t=' + Date.now();
        }

        var satelliteLayer = L.imageOverlay(
            getSatelliteURL(),
            [[ymin, xmin], [ymax, xmax]],
            { opacity: 0.6, interactive: false, attribution: 'NOAA / NESDIS — GOES GeoColor' }
        ).addTo(map);

        function actualizarSatelite() {
            satelliteLayer.setUrl(getSatelliteURL());
        }


        // ==========================================================
        // D. CAPA 2: RADAR EN VIVO (RAINVIEWER)
        // ==========================================================
        var radarLayer = L.layerGroup().addTo(map);
        var actualRadarTileLayer = null;

        function cargarRadarRainViewer() {
            fetch('https://api.rainviewer.com/public/weather-maps.json')
                .then(response => response.json())
                .then(data => {
                    radarLayer.clearLayers();
                    
                    var host = data.host;
                    var ultimasImagenes = data.radar.past;
                    if (!ultimasImagenes || ultimasImagenes.length === 0) return;
                    
                    var ultimaRuta = ultimasImagenes[ultimasImagenes.length - 1].path;
                    var tileUrl = host + ultimaRuta + '/256/{z}/{x}/{y}/2/1_1.png';

                    var sliderRadar = document.getElementById('opacityRadarSlider');
                    var opacidadInicial = sliderRadar ? parseFloat(sliderRadar.value) : 0.8;

                    actualRadarTileLayer = L.tileLayer(tileUrl, {
                        tileSize: 256,
                        opacity: opacidadInicial,
                        maxNativeZoom: 7,
                        maxZoom: 12,
                        attribution: 'Datos meteorológicos © <a href="https://www.rainviewer.com/" target="_blank">RainViewer</a>'
                    });

                    radarLayer.addLayer(actualRadarTileLayer);
                })
                .catch(err => console.error('Error cargando RainViewer:', err));
        }

        cargarRadarRainViewer();


        // ==========================================================
        // E. CAPA 3: DEPARTAMENTOS Y ETIQUETAS (INAB)
        // ==========================================================
        var departamentosURL = 'https://sig.inab.gob.gt/server/rest/services/InformacionBase/Basemap_DinCob2016_2020/MapServer/0/query?where=1%3D1&outFields=*&returnGeometry=true&f=geojson';
        var departamentosLayer = L.layerGroup();

        fetch(departamentosURL)
            .then(res => res.json())
            .then(data => {
                var departamentos = L.geoJSON(data, {
                    style: { color: 'white', weight: 1.5, opacity: 0.9, fill: false },
                    onEachFeature: function(feature, layer) {
                        var nombre = feature.properties.NOMBRE || feature.properties.NOMBRE_DPT || feature.properties.DEPARTAMEN || feature.properties.DEPARTAMENTO || feature.properties.name || '';
                        if (nombre) {
                            var centro = layer.getBounds().getCenter();
                            L.marker(centro, {
                                icon: L.divIcon({
                                    className: 'nombre-departamento',
                                    html: nombre,
                                    iconSize: [120, 20],
                                    iconAnchor: [60, 10]
                                }),
                                interactive: false
                            }).addTo(departamentosLayer);
                        }
                    }
                });

                departamentos.addTo(departamentosLayer);
                departamentosLayer.addTo(map);

                departamentosLayer.eachLayer(function(layer) {
                    if (layer instanceof L.Marker) {
                        layer.setZIndexOffset(1000);
                    }
                });

                L.geoJSON(data, {
                    style: { color: 'white', weight: 3, opacity: 1, fill: false }
                }).addTo(map);
            })
            .catch(err => console.error('Error cargando departamentos:', err));


        // ==========================================================
        // F. CONTROL DE CAPAS (COLAPSADO POR DEFECTO PARA AHORRAR ESPACIO)
        // ==========================================================
        var baseMaps = {
            "Esri Topográfico": esriTopo,
            "CartoDB Voyager": cartoVoyager
        };

        var overlayMaps = {
            "Satélite GOES": satelliteLayer,
            "Radar RainViewer": radarLayer,
            "Departamentos": departamentosLayer
        };

        // collapsed: true oculta la lista detrás de un icono
        L.control.layers(baseMaps, overlayMaps, { collapsed: true }).addTo(map);


        // ==========================================================
        // G. CONTROLES DE OPACIDAD DESPLEGABLES CON BOTÓN
        // ==========================================================
        var opacityControl = L.control({ position: 'topright' });

        opacityControl.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'leaflet-bar contenedor-opacidad');
            div.innerHTML = `
                <button type="button" class="btn-toggle-opacidad" onclick="togglePanelOpacidad()">
                    ⚙️ Opacidad
                </button>
                <div id="panelOpacidad" class="panel-sliders-opacidad">
                    <label>Satélite<br>
                        <input id="opacitySatSlider" type="range" min="0" max="1" step="0.05" value="0.6">
                    </label>
                    <label>Radar<br>
                        <input id="opacityRadarSlider" type="range" min="0" max="1" step="0.05" value="0.8">
                    </label>
                </div>
            `;
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        opacityControl.addTo(map);

        // Función para mostrar/ocultar el panel de opacidad
        function togglePanelOpacidad() {
            var panel = document.getElementById('panelOpacidad');
            if (panel) {
                panel.classList.toggle('activo');
            }
        }

        // Listeners para ajustar la opacidad
        document.addEventListener('input', function(e) {
            if (e.target.id === 'opacitySatSlider') {
                satelliteLayer.setOpacity(parseFloat(e.target.value));
            }
            if (e.target.id === 'opacityRadarSlider') {
                if (actualRadarTileLayer) {
                    actualRadarTileLayer.setOpacity(parseFloat(e.target.value));
                }
            }
        });


        // ==========================================================
        // H. INICIALIZACIÓN Y REFRESCADO
        // ==========================================================
        window.onload = function() {
            actualizarWebcam();
            
            // Refrescar Webcam cada 60 segundos
            setInterval(actualizarWebcam, 60000);
            
            // Refrescar Satélite GOES cada 5 minutos
            setInterval(actualizarSatelite, 300000);

            // Refrescar Radar RainViewer cada 10 minutos
            setInterval(cargarRadarRainViewer, 600000);
        };
    </script>
</body>
</html>
